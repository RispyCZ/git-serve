[package]
name = "git-serve"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
gix = { version = "0.87.1", default-features = false, features = ["revision", "max-performance-safe", "sha1"] }
mime_guess = "2.0.5"
nix = { version = "0.31.3", default-features = false, features = ["signal"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "signal", "process", "sync", "time", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
